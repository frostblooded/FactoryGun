name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  GODOT_VERSION: 4.5.1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          git ls-files '*.json' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Install Godot
        if: hashFiles('project.godot') != ''
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip

      - name: Import project
        if: hashFiles('project.godot') != ''
        run: godot --headless --import

      - name: Run GUT tests
        if: hashFiles('addons/gut/gut_cmdln.gd') != ''
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test -ginclude_subdirs -gexit

      - name: Check generated files and boot the game
        if: hashFiles('project.godot') != ''
        run: |
          set -o pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Import or tests changed the tree. Commit the generated .uid files."
            exit 1
          fi
          godot --headless --quit-after 300 2>&1 | tee "$RUNNER_TEMP/boot.log"
          if grep -nE 'SCRIPT ERROR|Parse Error|^ERROR:|^WARNING:' "$RUNNER_TEMP/boot.log"; then
            echo "::error::The game printed errors or warnings while booting."
            exit 1
          fi
